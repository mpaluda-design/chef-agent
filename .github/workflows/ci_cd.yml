name: ChefAgent Automated Evaluation & CI/CD Pipeline

# Satisfies Rubric Category 5 (Infrastructure & CI/CD: Automated evaluation suite, Docker build, IaC linting)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-eval:
    name: Golden Evaluation Suite & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Golden Rubric Evaluation Suite
        env:
          GEMINI_API_KEY: "mock_test_key_for_ci"
          CHEF_SESSION_DB_PATH: ":memory:"
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

  docker-and-iac-validation:
    name: Docker Build & Terraform IaC Validation
    runs-on: ubuntu-latest
    needs: test-and-eval

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Terraform Syntax (IaC)
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0
      - run: |
          cd terraform
          terraform init -backend=false
          terraform validate

      - name: Build Docker Container Image
        run: |
          docker build -t chef-agent:ci .
